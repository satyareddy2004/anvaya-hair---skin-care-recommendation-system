<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvaya - Cart</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: blur(5px);
        }
        .cart-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        h1 {
            color: #6b4e31;
            margin: 0 0 20px;
            font-size: 28px;
        }
        #cartItems {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columns */
            gap: 10px; /* Space between items */
        }
        #cartItems.loaded {
            opacity: 1;
        }
        .cart-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .cart-item .image-container {
            width: 60px;
            height: 60px;
            background-color: #f0f0f0;
            position: relative;
            margin-right: 10px;
        }
        .cart-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .cart-item img.loaded {
            display: block;
        }
        .cart-item p {
            color: #6b4e31;
            margin: 3px 0;
            font-size: 14px;
        }
        .cart-item button {
            padding: 5px 10px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #d4a373;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #b08968;
        }
        .go-to-home {
            margin-top: 10px;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d4a373;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="cart-box">
        <h1>Your Cart</h1>
        <div class="loading-spinner" id="loadingSpinner"></div>
        <div id="cartItems"></div>
        <p id="totalPrice">TOTAL: ₹0</p>
        <button onclick="checkout()">Checkout</button>
        <button class="go-to-home" onclick="window.location.href='select.html'">Go to Home</button>
    </div>
    <script>
        async function displayCart() {
            try {
                const userId = localStorage.getItem('userId') || 'defaultUser';
                const response = await fetch(`/cart/${userId}`);
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || 'Failed to fetch cart');
                }

                const cartItems = document.getElementById('cartItems');
                const loadingSpinner = document.getElementById('loadingSpinner');
                cartItems.innerHTML = '';
                let total = 0;
                let loadedImages = 0;
                const totalImages = result.cart.length;

                if (totalImages === 0) {
                    cartItems.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Your cart is empty.</p>';
                    loadingSpinner.style.display = 'none';
                    cartItems.classList.add('loaded');
                    return;
                }

                const fragment = document.createDocumentFragment();
                result.cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="image-container">
                            <img src="assets/images/${item.image}" alt="${item.name}" onerror="this.src='assets/images/placeholder.jpg'">
                        </div>
                        <div>
                            <p>${item.name}</p>
                            <p>₹${item.price} x ${item.quantity}</p>
                            <p>TOTAL: ₹${itemTotal}</p>
                            <button onclick="removeFromCart('${item._id}', ${index})">Remove</button>
                        </div>
                    `;
                    const img = itemDiv.querySelector('img');
                    img.onload = () => {
                        img.classList.add('loaded');
                        loadedImages++;
                        if (loadedImages === totalImages) {
                            loadingSpinner.style.display = 'none';
                            cartItems.classList.add('loaded');
                        }
                    };
                    img.onerror = () => {
                        img.src = 'assets/images/placeholder.jpg';
                        loadedImages++;
                        if (loadedImages === totalImages) {
                            loadingSpinner.style.display = 'none';
                            cartItems.classList.add('loaded');
                        }
                    };
                    fragment.appendChild(itemDiv);
                });

                cartItems.appendChild(fragment);
                document.getElementById('totalPrice').textContent = `TOTAL: ₹${total}`;
            } catch (error) {
                console.error('Error fetching cart:', error);
                alert('Error fetching cart: ' + error.message);
            }
        }

        async function removeFromCart(itemId, index) {
            try {
                const userId = localStorage.getItem('userId') || 'defaultUser';
                const response = await fetch(`/cart/remove/${userId}/${itemId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || 'Failed to remove from cart');
                }
                displayCart();
            } catch (error) {
                console.error('Error removing from cart:', error);
                alert('Error removing from cart: ' + error.message);
            }
        }

        async function checkout() {
            try {
                const userId = localStorage.getItem('userId') || 'defaultUser';
                const response = await fetch(`/cart/clear/${userId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || 'Failed to clear cart');
                }
                window.location.href = 'checkout-success.html';
            } catch (error) {
                console.error('Error clearing cart:', error);
                alert('Error clearing cart: ' + error.message);
            }
        }

        displayCart();
    </script>
</body>
</html>

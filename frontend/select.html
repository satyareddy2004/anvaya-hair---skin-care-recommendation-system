<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvaya - Select Category</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }
        .select-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #6b4e31;
            margin: 0 0 20px;
            font-size: 28px;
            text-transform: uppercase;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #d4a373;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
            max-width: 200px;
        }
        button:hover {
            background-color: #b08968;
        }
        .go-to-cart {
            display: none;
            margin: 10px auto 0;
            width: 100%;
            max-width: 200px;
        }
        .go-to-cart.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="select-box">
        <h1>Select Category</h1>
        <button onclick="selectCategory('hair')">Hair</button>
        <button onclick="selectCategory('skin')">Skin</button>
        <button class="go-to-cart" onclick="window.location.href='cart.html'">Go to Cart</button>
    </div>
    <script>
        function selectCategory(category) {
            localStorage.setItem('category', category);
            window.location.href = category === 'hair' ? 'hair-questions.html' : 'skin-questions.html';
        }

        async function checkCart() {
            try {
                const userId = localStorage.getItem('userId') || 'defaultUser';
                const response = await fetch(`/cart/${userId}`);
                const result = await response.json();
                if (result.success && result.cart.length > 0) {
                    // Show the "Go to Cart" button if there are items in the cart
                    document.querySelector('.go-to-cart').classList.add('visible');
                }
            } catch (error) {
                console.error('Error checking cart:', error);
            }
        }

        // Check the cart when the page loads
        checkCart();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvaya - Upload Photo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }
        .upload-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #6b4e31;
            margin: 0 0 20px;
            font-size: 28px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #d4a373;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #b08968;
        }
    </style>
</head>
<body>
    <div class="upload-box">
        <h1>Upload Photo</h1>
        <input type="file" id="photoInput" accept="image/*">
        <button onclick="uploadPhoto()">Upload and Analyze</button>
    </div>
    <script>
        async function uploadPhoto() {
            const photoInput = document.getElementById('photoInput');
            if (!photoInput.files[0]) {
                alert('Please select a photo to upload.');
                return;
            }

            const formData = new FormData();
            formData.append('photo', photoInput.files[0]);

            try {
                // Upload the photo
                const uploadResponse = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                if (!uploadResponse.ok) {
                    throw new Error(`Upload failed with status: ${uploadResponse.status}`);
                }
                const uploadResult = await uploadResponse.json();
                if (!uploadResult.success) {
                    throw new Error(uploadResult.error || 'Upload failed');
                }

                const imagePath = uploadResult.filePath; // e.g., 'uploads/image.jpg'
                const answers = JSON.parse(localStorage.getItem('answers')) || {};
                const category = localStorage.getItem('category') || 'hair';
                const userId = localStorage.getItem('userId') || 'defaultUser';

                console.log('Sending /recommend request with:', { userId, answers, category, imagePath });

                // Call the /recommend endpoint with the image path
                const recommendResponse = await fetch('/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, answers, category, imagePath })
                });
                if (!recommendResponse.ok) {
                    const text = await recommendResponse.text();
                    throw new Error(`Recommend failed with status: ${recommendResponse.status}, response: ${text}`);
                }
                const recommendResult = await recommendResponse.json();
                if (!recommendResult.success) {
                    throw new Error(recommendResult.error || 'Recommendation failed');
                }

                // Store the entire recommendResult (includes recommendations, mlPrediction, and problem)
                localStorage.setItem('recommendations', JSON.stringify(recommendResult));
                window.location.href = 'recommendation-options.html';
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred: ' + error.message);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvaya - Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #6b4e31;
            margin: 0 0 20px;
            font-size: 28px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #d4a373;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #b08968;
        }
        .error {
            color: red;
            font-size: 14px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>LOGIN</h1>
        <input type="text" id="username" placeholder="Username" required>
        <div id="usernameError" class="error"></div>
        <input type="password" id="password" placeholder="Password" required>
        <div id="passwordError" class="error"></div>
        <button onclick="validateAndLogin()">Login</button>
        <button onclick="skip()">Skip</button>
        <button onclick="window.location.href='newuser.html'">New User</button>
        <button onclick="showForgotPasswordPrompt()">Forgot Password</button>
        <div id="forgotPasswordForm" style="display: none;">
            <input type="email" id="forgotEmail" placeholder="Enter your email" style="margin-top: 10px;">
            <div id="emailError" class="error"></div>
            <button onclick="forgotPassword()">Submit Email</button>
        </div>
    </div>
    <script>
        function validateAndLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');

            const usernameRegex = /^[a-zA-Z0-9]{6,}$/;
            if (!usernameRegex.test(username)) {
                usernameError.textContent = 'Username must be at least 6 characters, letters and numbers only.';
                return;
            }

            const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordRegex.test(password)) {
                passwordError.textContent = 'Password must be 8+ characters, with uppercase, lowercase, number, and symbol.';
                return;
            }

            usernameError.textContent = '';
            passwordError.textContent = '';
            login(username, password);
        }

        async function login(username, password) {
            try {
                const response = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    alert('Login successful!');
                    window.location.href = 'select.html';
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        function showForgotPasswordPrompt() {
            const form = document.getElementById('forgotPasswordForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function forgotPassword() {
            const email = document.getElementById('forgotEmail').value;
            const emailError = document.getElementById('emailError');
            if (!email) {
                emailError.textContent = 'Please enter your email.';
                return;
            }

            emailError.textContent = '';
            try {
                const response = await fetch('http://localhost:3000/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function skip() {
            window.location.href = 'select.html';
        }
    </script>
</body>
</html>

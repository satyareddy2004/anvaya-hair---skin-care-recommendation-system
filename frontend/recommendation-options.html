<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvaya - Recommendation Options</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }
        .options-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #6b4e31;
            margin: 0 0 20px;
            font-size: 28px;
            text-transform: uppercase;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #d4a373;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
            max-width: 200px;
        }
        button:hover {
            background-color: #b08968;
        }
        .go-to-home {
            margin-top: 10px;
        }
        .go-to-cart {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="options-box">
        <h1>Choose Your Option</h1>
        <button onclick="localStorage.setItem('recommendationType', 'commercial'); window.location.href='recommendation.html'">Commercial Products</button>
        <button onclick="localStorage.setItem('recommendationType', 'natural'); window.location.href='natural-remedies.html'">Natural Remedies</button>
        <button class="go-to-home" onclick="window.location.href='select.html'">Go to Home</button>
        <button class="go-to-cart" onclick="window.location.href='cart.html'">Go to Cart</button>
    </div>
</body>
</html>
